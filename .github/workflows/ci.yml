name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Unit tests can't catch a bundle that crashes inside Electron's own Node (native modules,
      # require of ESM). Package the app and boot it for real against the in-process simulator.
      - name: Smoke-test the packaged app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
          ROCKZALCT_SKIP_REBUILD: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pnpm --filter @rockzalct/desktop pack:dir
          cd apps/desktop/release/linux-unpacked
          timeout 90 xvfb-run -a ./@rockzalctdesktop --sim --smoke-test --no-sandbox 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
