name: Release (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed only to attach the installer to a GitHub release on tag builds

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build
      - name: Build NSIS installer (unsigned)
        run: pnpm --filter @rockzalct/desktop dist:win
      - name: Verify installer exists
        shell: bash
        run: |
          ls -la apps/desktop/release
          test -f "$(ls apps/desktop/release/RockzaLCT-Setup-*.exe | head -n1)"
      - uses: actions/upload-artifact@v4
        with:
          name: RockzaLCT-Setup
          path: apps/desktop/release/RockzaLCT-Setup-*.exe
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/desktop/release/RockzaLCT-Setup-*.exe --clobber
